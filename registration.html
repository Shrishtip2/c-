<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event Registration</title>

<link rel="stylesheet" href="style1.css">
```

</head>

<body>

```
<!-- Header -->

<header>

    <h1>College Events</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="registration.html">Registration</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<!-- Registration Form -->

<div class="form-box">

    <h2>Event Registration</h2>

    <p style="text-align:center; color:#666;">
        Fill in the details below to register for an event.
    </p>


    <form>

        <label>Student Name</label>

        <input
            type="text"
            placeholder="Enter your full name"
            required
        >


        <label>Student ID</label>

        <input
            type="text"
            placeholder="Enter your student ID"
            required
        >


        <label>Email Address</label>

        <input
            type="email"
            placeholder="Enter your email"
            required
        >


        <label>Phone Number</label>

        <input
            type="tel"
            placeholder="Enter your phone number"
            required
        >


        <label>Department</label>

        <select required>

            <option value="">Select Department</option>

            <option>CSE</option>
            <option>IT</option>
            <option>ECE</option>
            <option>ME</option>
            <option>Civil</option>
            <option>Other</option>

        </select>


        <label>Select Event</label>

        <select required>

            <option value="">Choose an Event</option>

            <option>Annual Function</option>
            <option>Tech Fest 2026</option>
            <option>Sports Day</option>
            <option>Freshers Party</option>
            <option>Cultural Fest</option>
            <option>Quiz Competition</option>

        </select>


        <label>Message</label>

        <textarea
            placeholder="Enter any additional information"
        ></textarea>


        <button type="submit">
            Submit Registration
        </button>

    </form>

</div>


<!-- Footer -->

<footer>

    <p>© 2026 College Event Management System</p>

    <p>Designed for College Mini Project</p>

</footer>
```

</body>

</html>
